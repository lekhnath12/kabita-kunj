<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kabita Kunj</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .main-layout { display: flex; gap: 20px; margin-top: 20px; }
        .editor-section { flex: 2; }
        .rhyme-section { flex: 1; background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px solid #ddd; }
        .rhyme-list { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; }
        .rhyme-btn { text-align: left; padding: 8px; border: 1px solid #ccc; background: white; cursor: pointer; border-radius: 4px; }
        .rhyme-btn:hover { background: #eef; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kabita Kunj</h1>

        <div class="settings-bar">
            <div class="setting-group">
                <label><b>Chhanda:</b></label>
                <input type="text" id="formula-input" value="lSSlSSlSSlSS">
            </div>
            <div class="setting-group">
                <label><b>Syllables:</b> <span id="syl-val">3</span></label>
                <input type="range" id="syl-slider" min="1" max="5" value="3">
            </div>
            <button class="btn-update" id="update-formula">Update & Reset</button>
        </div>

        <div class="main-layout">
            <div class="editor-section">
                <div id="status">Needs: <span id="rem-formula">lSSlSSlSSlSS</span></div>
                <div id="poem-canvas"></div>
                <div class="controls-bar">
                    <button id="refresh-suggestions" class="action-btn">Shuffle ↻</button>
                    <button id="backspace-btn" class="action-btn btn-danger">Backspace ⌫</button>
                </div>
                <div id="suggestion-box"><div id="word-suggestions"></div></div>
            </div>

            <div class="rhyme-section">
                <h3>Rhyme Helper</h3>
                <p style="font-size: 0.8em; color: #666;">Top rhymes for current selection:</p>
                <div id="rhyme-suggestions" class="rhyme-list"></div>
            </div>
        </div>

        <div id="input-container">
            <div id="dropdown-menu"></div>
            <input type="text" id="roman-input" placeholder="Type Romanized..." autocomplete="off">
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
