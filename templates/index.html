<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kabita Kunj</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Kabita Kunj</h1>

        <div class="settings-bar">
            <div class="setting-group">
                <label><b>Chhanda Rhythm:</b></label>
                <input type="text" id="formula-input" value="lSSlSSlSSlSS" placeholder="e.g. lSlSSllSlSS">
            </div>
            <div class="setting-group">
                <label><b>Syllables:</b> <span id="syl-val">3</span></label>
                <input type="range" id="syl-slider" min="1" max="5" value="3" step="1">
            </div>
            <button class="btn-update" id="update-formula">Update & Reset</button>
        </div>

        <div id="status">Current Line Needs: <span id="rem-formula">lSSlSSlSSlSS</span></div>
        
        <div id="poem-canvas"></div>

        <div class="controls-bar">
            <button id="refresh-suggestions" class="action-btn">Shuffle Suggestions ↻</button>
            <button id="backspace-btn" class="action-btn btn-danger">Backspace ⌫</button>
        </div>
        
        <div id="suggestion-box">
            <div id="word-suggestions"></div>
        </div>

        <div id="input-container">
            <div id="dropdown-menu"></div>
            <input type="text" id="roman-input" placeholder="Type Romanized (e.g. 'sake')..." autocomplete="off">
            <p class="hint">Use <b>Arrow Keys</b> to pick from dropdown, <b>Enter/Space</b> to add.</p>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
